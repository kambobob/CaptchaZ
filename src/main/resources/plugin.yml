name: CaptchaGate
version: 1.0.0
main: com.captchagate.CaptchaGate
api-version: '1.20'
softdepend: [AuthMe]
author: You
description: Sends joining players to an isolated void platform and makes them solve a captcha.
commands:
  captchaz:
    description: Answer the join captcha
    usage: /captchaz <code>
permissions:
  captchagate.bypass:
    description: Skip the join captcha
    default: false
